{% load static %}
<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{% block meta_description %}Bienvenido a nuestra tienda online.{% endblock %}">
	<title>{% block title %}Mi tienda{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-white border-bottom">
		<div class="container">
			<a class="navbar-brand fw-semibold" href="{% url 'home' %}">Mi tienda</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegación">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Inicio</a></li>
					<li class="nav-item"><a class="nav-link" href="{% url 'home' %}#productos">Productos</a></li>
					<li class="nav-item"><a class="nav-link" href="{% url 'home' %}#contacto">Contacto</a></li>
					<li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Login</a></li>
				</ul>
			</div>
		</div>
	</nav>

	{% block content %}{% endblock %}

	<footer id="contacto" class="py-4 border-top">
		<div class="container">
			<p class="small text-secondary mb-0">&copy; {% now "Y" %} Mi tienda</p>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
